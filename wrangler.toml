# [修改] Worker 名与 Cloudflare Workers Builds 项目名（nodecrypt-plus）保持一致。
# 原先为 "nodecrypt"，CI 每次构建都会报 "Failed to match Worker name" 并尝试自动开 PR 改这一行。
# 注意：若把这个分支合并回原 nodecrypt 仓库的 main，本地 `wrangler deploy` 会部署到
# nodecrypt-plus 这个 Worker 上，届时需要把本行改回 "nodecrypt"。
name = "nodecrypt-plus"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 配置静态资源
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# ============================================================
# [新增-消息留存] 消息留存所需的存储绑定
#
# [修改] 这里刻意不写 database_id、也不预建桶，改用 wrangler 的
# 「自动资源供给」(automatic resource provisioning)：
#   - 需要 wrangler >= 4.45.0（package.json 已从 ^4.16.1 升到 ^4.136.3，
#     原版本太旧，不认识这个特性，只会硬报 10021 错误）
#   - 部署时若账号下还没有同名资源，wrangler 会自己调 Cloudflare API
#     创建 D1 库 / R2 桶并绑定到 Worker，之后持续保持绑定
#   - 该功能目前是 open beta，默认开启，可用 --no-x-provision 关闭
# 这样就不必在本地跑 `wrangler d1 create`，也不会再因占位符 id 导致部署失败。
#
# 建表（一次性）：beta 阶段 wrangler 不会把生成的 id 回写到 .toml 配置，
# 因此 `wrangler d1 migrations apply` 在 CI 里仍然用不了。首次部署成功后，
# 到 Cloudflare 面板 → Storage & Databases → D1 → nodecrypt-history → Console，
# 把 worker/migrations/0001_history.sql 整个粘进去执行即可（语句均为 IF NOT EXISTS，可重复执行）。
#
# 若自动供给没有生效（beta 阶段有可能），退回手动方式：面板上建库，
# 再把 database_id 填回下面的 d1_databases。删掉这两段绑定时，
# 客户端与 Worker 都会自动降级为「不存储」，实时聊天不受任何影响。
# ============================================================

[[d1_databases]]
binding = "DB"
database_name = "nodecrypt-history"
# [修改] 不写 database_id，交给 wrangler 自动创建并绑定
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "HISTORY_BLOB"
# [修改] 桶若不存在，原则上也由自动供给创建；万一没有，在面板 R2 里
# 手动建一个同名桶即可（R2 绑定只需要桶名，不需要任何 id）
bucket_name = "nodecrypt-history-blobs"

# [新增-消息留存] 每分钟清理一次过期历史（留存分辨率要求 1 分钟）
[triggers]
crons = ["* * * * *"]
